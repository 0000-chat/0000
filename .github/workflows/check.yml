name: Check workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check:topology
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run test:docs
      - run: bun run check:docs:artifact
      - name: Check the current commit tree
        run: node packages/documentation-tools/cli.mjs --repo 0000-chat/0000 --mode commit --commit "$GITHUB_SHA"
      - name: Check every newly published documentation commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE"
          fi
          node packages/documentation-tools/cli.mjs --repo 0000-chat/0000 --mode published --base-ref "$base" --head "$GITHUB_SHA"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:release
      - name: Check license topology
        run: bun run check:licenses
      - run: bun run check:turbo
      - run: bun run check:turbo:dry
      - name: Check Brain service
        working-directory: services/brain
        run: bun run check:application
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm --dir services/gateway/tooling install --frozen-lockfile
      - run: pnpm --dir services/gateway run check:application
      - name: Install Database service dependencies
        working-directory: services/database
        run: pnpm install --frozen-lockfile
      - name: Check Database service
        working-directory: services/database
        run: pnpm run check:application
