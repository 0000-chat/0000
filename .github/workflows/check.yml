name: Check workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:turbo
      - run: bun run check:turbo:dry
      - name: Check Brain service
        working-directory: services/brain
        run: bun run check:application
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm --dir services/gateway/tooling install --frozen-lockfile
      - run: pnpm --dir services/gateway run check:application
