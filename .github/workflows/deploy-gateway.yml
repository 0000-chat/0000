name: Deploy Gateway

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:turbo
      - run: bun run check:turbo:dry
      - name: Check Brain service
        working-directory: services/brain
        run: bun run check:application
      - run: pnpm --dir services/gateway/tooling install --frozen-lockfile
      - run: pnpm --dir services/gateway run check:application
      - name: Verify current main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "Refusing to deploy stale commit $EXPECTED_SHA; origin/main is $remote_sha." >&2
            exit 1
          fi
      - name: Deploy Gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d8f2eee5aab20d72439aabdfbb221bb7
        run: pnpm --dir services/gateway exec wrangler deploy --config wrangler.jsonc
      - name: Smoke-test Gateway
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-connrefused https://gateway.0000.chat/health)"
          test "$response" = '{"status":"ok","service":"gateway"}'
